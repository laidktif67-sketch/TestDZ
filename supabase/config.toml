project_id = "naqjjykcglxiobkmdllj"

[api]
enabled = true
port = 54321
# Expose the app-facing V2 schema to local PostgREST. Keep rebuild_v2_private hidden.
schemas = ["public", "graphql_public", "rebuild_v2"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = [
  "http://localhost:5173/auth/callback",
  "http://localhost:5173/reset-password"
]
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true
secure_password_change = true

# Local development only. Start Mailpit on the host at ports 1025/8025.
# Do not copy these local SMTP settings to the hosted Supabase project.
[auth.email.smtp]
enabled = true
host = "host.docker.internal"
port = 1025
user = "test"
pass = "test"
admin_email = "noreply@localhost"
sender_name = "TestDZ Local"

# Candidate-only server-to-server notification worker. The function validates
# its own dispatch secret; browser/session JWTs are not accepted.
[functions.dispatch-notifications]
verify_jwt = false

# Authenticated Developer/Tester invitation API. The function verifies sessions with Auth.
[functions.developer-invitations]
verify_jwt = true
