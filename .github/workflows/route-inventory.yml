name: Route inventory guard

on:
  push:
    branches:
      - refactor/feature-based-architecture
    paths:
      - "apps/web/src/AppRoutes.tsx"
      - "apps/web/src/routes/**"
      - "scripts/check-route-inventory.mjs"
      - "package.json"
      - ".github/workflows/route-inventory.yml"
  pull_request:
    paths:
      - "apps/web/src/AppRoutes.tsx"
      - "apps/web/src/routes/**"
      - "scripts/check-route-inventory.mjs"
      - "package.json"
      - ".github/workflows/route-inventory.yml"

permissions:
  contents: read

jobs:
  route-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Check route inventory and route-module contracts
        run: npm run check:routes
