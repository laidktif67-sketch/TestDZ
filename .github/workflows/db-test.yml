name: TestDZ Database CI

on:
  push:
    branches: [main, "feat/week-5-*", "fix/week-5-*"]
    paths: ["supabase/**", ".github/workflows/db-test.yml"]
  pull_request:
    paths: ["supabase/**", ".github/workflows/db-test.yml"]

permissions:
  contents: read

concurrency:
  group: db-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================
  # JOB 1: Fresh CI (schema + behavioral + rls + concurrency)
  # ============================================================
  database:
    name: Fresh — migrations + pgTAP + concurrency
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v3
        with:
          version: 2.84.2

      - name: Ensure psql
        run: |
          if ! command -v psql &>/dev/null; then
            sudo apt-get update && sudo apt-get install -y postgresql-client
          fi
          psql --version

      - name: Start Supabase
        run: supabase start

      - name: Reset database (all migrations)
        shell: bash
        run: |
          log_file=/tmp/supabase-db-reset.log
          for attempt in 1 2 3; do
            echo "▶️ Database reset attempt $attempt/3"
            if supabase db reset --local --no-seed >"$log_file" 2>&1; then
              cat "$log_file"
              echo "✅ Reset succeeded (attempt $attempt)"
              exit 0
            fi

            cat "$log_file"
            if grep -Fq '127.0.0.1:54321/storage/v1/bucket' "$log_file" &&
               grep -Fq 'context deadline exceeded' "$log_file"; then
              if [ "$attempt" -lt 3 ]; then
                echo "⚠️ Detected transient Storage API timeout; retrying reset in 10s..."
                sleep 10
                continue
              fi
              echo "❌ Storage API timed out on all 3 reset attempts"
              echo "Docker containers:"
              docker ps -a
              storage_container="$(docker ps -a --format '{{.Names}}' | grep -m1 'storage' || true)"
              if [ -n "$storage_container" ]; then
                echo "Storage container logs ($storage_container):"
                docker logs "$storage_container" 2>&1 | tail -80
              fi
              exit 1
            fi

            echo "❌ Reset failed for a reason other than the known transient Storage timeout; not retrying."
            exit 1
          done

      - name: Run pgTAP tests (schema + behavioral)
        run: supabase test db --local

      - name: Setup DB URL
        run: |
          DB_URL=$(supabase status -o json | jq -r '.DB_URL')
          if [ -z "$DB_URL" ] || [ "$DB_URL" = "null" ]; then
            echo "❌ DB_URL not available"; supabase status; exit 1
          fi
          echo "SUPABASE_DB_URL=$DB_URL" >> $GITHUB_ENV

      - name: Run RLS test (bash)
        run: bash supabase/tests/migration_016c_rls.sh

      - name: Run concurrency test
        run: bash supabase/tests/migration_016c_concurrency.sh

  # ============================================================
  # JOB 2: Upgrade CI (legacy success)
  # ============================================================
  upgrade:
    name: Upgrade — legacy data migration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v3
        with:
          version: 2.84.2

      - name: Ensure psql
        run: |
          if ! command -v psql &>/dev/null; then
            sudo apt-get update && sudo apt-get install -y postgresql-client
          fi
          psql --version

      # ⚠️ MOVE 016c OUT BEFORE `supabase start`
      - name: Move 016c out
        run: |
          F=supabase/migrations/20261107000300_cohort_triggers_data_migration.sql
          [ -f "$F" ] || { echo "❌ $F not found"; exit 1; }
          mv "$F" /tmp/
          echo "Moved: $F → /tmp/"

      - name: Start Supabase
        run: supabase start

      - name: Reset to 016b
        run: supabase db reset --local --no-seed

      - name: Restore 016c (must succeed)
        if: always()
        run: |
          F=/tmp/20261107000300_cohort_triggers_data_migration.sql
          if [ ! -f "$F" ]; then
            echo "❌ 016c not in /tmp"
            exit 1
          fi
          mv "$F" supabase/migrations/
          [ -f supabase/migrations/20261107000300_cohort_triggers_data_migration.sql ] \
            || { echo "❌ restore failed"; exit 1; }
          echo "✓ 016c restored"

      - name: Setup DB URL
        run: |
          DB_URL=$(supabase status -o json | jq -r '.DB_URL')
          echo "SUPABASE_DB_URL=$DB_URL" >> $GITHUB_ENV

      - name: Prepare legacy data
        run: bash supabase/tests/migration_016c_upgrade_prepare.sh

      - name: Verify 016c not in history before apply
        run: |
          HISTORY=$(psql "$SUPABASE_DB_URL" -tA -v ON_ERROR_STOP=1 -c "
            SELECT COUNT(*) FROM supabase_migrations.schema_migrations
            WHERE version = '20261107000300';")
          if [ "$HISTORY" -ne 0 ]; then
            echo "❌ 016c already in history"
            exit 1
          fi
          echo "✓ 016c not in history"

      - name: Apply 016c
        run: supabase migration up --local

      - name: Verify upgrade
        run: bash supabase/tests/migration_016c_upgrade_verify.sh

  # ============================================================
  # JOB 3: Upgrade Negative (rollback)
  # ============================================================
  upgrade-negative:
    name: Upgrade — negative (rollback)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v3
        with:
          version: 2.84.2

      - name: Ensure psql
        run: |
          if ! command -v psql &>/dev/null; then
            sudo apt-get update && sudo apt-get install -y postgresql-client
          fi
          psql --version

      # ⚠️ MOVE 016c OUT BEFORE `supabase start`
      - name: Move 016c out
        run: |
          F=supabase/migrations/20261107000300_cohort_triggers_data_migration.sql
          [ -f "$F" ] || { echo "❌ $F not found"; exit 1; }
          mv "$F" /tmp/
          echo "Moved: $F → /tmp/"

      - name: Start Supabase
        run: supabase start

      - name: Reset to 016b
        run: supabase db reset --local --no-seed

      - name: Restore 016c (must succeed)
        if: always()
        run: |
          F=/tmp/20261107000300_cohort_triggers_data_migration.sql
          if [ ! -f "$F" ]; then
            echo "❌ 016c not in /tmp"
            exit 1
          fi
          mv "$F" supabase/migrations/
          [ -f supabase/migrations/20261107000300_cohort_triggers_data_migration.sql ] \
            || { echo "❌ restore failed"; exit 1; }
          echo "✓ 016c restored"

      - name: Setup DB URL
        run: |
          DB_URL=$(supabase status -o json | jq -r '.DB_URL')
          echo "SUPABASE_DB_URL=$DB_URL" >> $GITHUB_ENV

      - name: Create conflicting legacy data
        run: bash supabase/tests/migration_016c_upgrade_conflict.sh

      - name: Apply 016c — must fail
        run: |
          set +e
          supabase migration up --local > /tmp/016c_apply.log 2>&1
          EXIT=$?
          set -e
          if [ "$EXIT" -eq 0 ]; then
            echo "❌ 016c succeeded but should fail"
            cat /tmp/016c_apply.log
            exit 1
          fi
          if ! grep -q "016c_CONFLICT" /tmp/016c_apply.log; then
            echo "❌ wrong error (expected 016c_CONFLICT)"
            cat /tmp/016c_apply.log
            exit 1
          fi
          echo "✅ 016c failed with expected 016c_CONFLICT"

      - name: Verify rollback (must prove no changes)
        run: bash supabase/tests/migration_016c_upgrade_rollback_verify.sh
