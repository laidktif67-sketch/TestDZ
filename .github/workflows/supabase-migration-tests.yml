name: Supabase migration regression tests

on:
  push:
    branches:
      - architecture-v1
      - main
    paths:
      - "supabase/**"
      - ".github/workflows/supabase-migration-tests.yml"
  pull_request:
    paths:
      - "supabase/**"
      - ".github/workflows/supabase-migration-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-local-migration-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 3.2.0

      - name: Start isolated local Supabase services
        run: supabase start -x studio,edge-runtime,storage-api,imgproxy,logflare,vector

      - name: Apply migrations and run SQL regression tests locally
        run: supabase test db

      - name: Stop local Supabase services
        if: always()
        run: supabase stop --no-backup
