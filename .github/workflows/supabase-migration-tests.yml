name: Supabase migration regression tests

on:
  push:
    branches:
      - architecture-v1
      - main
    paths:
      - "supabase/**"
      - ".github/workflows/supabase-migration-tests.yml"
      - "scripts/storage-api-regression.mjs"
  pull_request:
    paths:
      - "supabase/**"
      - ".github/workflows/supabase-migration-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-local-migration-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Supabase CLI
        id: setup-cli
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Start isolated local Supabase services
        run: supabase start -x studio,edge-runtime,logflare,vector

      - name: Apply migrations and run SQL regression tests locally
        run: supabase test db

      - name: Run authenticated Storage API regression tests locally
        run: |
          set -euo pipefail
          eval "$(supabase status -o env)"
          export SUPABASE_URL="${API_URL:-${SUPABASE_URL:-}}"
          export SUPABASE_ANON_KEY="${ANON_KEY:-${SUPABASE_ANON_KEY:-}}"
          export SUPABASE_SERVICE_ROLE_KEY="${SERVICE_ROLE_KEY:-${SUPABASE_SERVICE_ROLE_KEY:-}}"
          node scripts/storage-api-regression.mjs

      - name: Stop local Supabase services
        if: always() && steps.setup-cli.outcome == 'success'
        run: supabase stop --no-backup
