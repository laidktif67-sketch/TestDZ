name: Apply one Supabase migration

on:
  workflow_dispatch:
    inputs:
      migration:
        description: Migration to apply to the development project
        type: choice
        required: true
        options:
          - 016a
          - 016b
          - 016c
      mode:
        description: Execution mode (safe connection test by default)
        type: choice
        required: true
        default: test-connection
        options:
          - test-connection
          - apply

permissions:
  contents: read

concurrency:
  group: testdz-supabase-development-migrations
  cancel-in-progress: false

jobs:
  verify-preconditions:
    if: github.ref == 'refs/heads/feat/week-4-design-system'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: development
    steps:
      - name: Checkout the approved base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Validate target project and database URL
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          test "$SUPABASE_PROJECT_REF" = "naqjjykcglxiobkmdllj"
          python3 - <<'PY'
          import os
          import re
          import sys
          from urllib.parse import unquote, urlparse

          ref = os.environ["SUPABASE_PROJECT_REF"]
          url = os.environ["SUPABASE_DB_URL"]

          # A DNS hostname must not be wrapped in square brackets.
          if re.search(r'@\[[A-Za-z0-9.-]+\](?=:\d|/|$)', url):
              print("ERROR: SUPABASE_DB_URL has brackets around a DNS hostname.", file=sys.stderr)
              print("Remove [ ] from the hostname (for example: aws-1-eu-west-3.pooler.supabase.com).", file=sys.stderr)
              print("Square brackets are for IP literals such as IPv6, not DNS hostnames.", file=sys.stderr)
              sys.exit(1)

          try:
              parsed = urlparse(url)
              host = parsed.hostname or ""
              user = unquote(parsed.username or "")
              port = parsed.port
          except ValueError:
              print("ERROR: SUPABASE_DB_URL is malformed (check hostname brackets and port).", file=sys.stderr)
              sys.exit(1)

          if parsed.scheme not in ("postgres", "postgresql") or not host:
              print("ERROR: SUPABASE_DB_URL must be a valid PostgreSQL URL with a hostname.", file=sys.stderr)
              sys.exit(1)

          if ref not in host and ref not in user:
              print("ERROR: SUPABASE_DB_URL does not identify the approved TestDZ project.", file=sys.stderr)
              sys.exit(1)

          print(f"hostname: {host}")
          print(f"user: {user}")
          print(f"port: {port}")
          print(f"database: {parsed.path.lstrip('/') or 'postgres'}")
          print(f"url length: {len(url)}")
          print(f"project ref: {ref}")
          PY

      - name: Verify remote migration preconditions
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          MIGRATION: ${{ inputs.migration }}
        run: |
          set -euo pipefail
          case "$MIGRATION" in
            016a) FILE="supabase/tests/verify_preconditions_016a.sql" ;;
            016b) FILE="supabase/tests/verify_preconditions_016b.sql" ;;
            016c) FILE="supabase/tests/verify_preconditions_016c.sql" ;;
            *) echo "Unsupported migration selection"; exit 1 ;;
          esac
          psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -f "$FILE"

  test-connection:
    needs: verify-preconditions
    if: github.ref == 'refs/heads/feat/week-4-design-system' && inputs.mode == 'test-connection'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: development
    steps:
      - name: Checkout the approved base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up pinned Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 3.2.0

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Validate target project and database URL
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          test "$SUPABASE_PROJECT_REF" = "naqjjykcglxiobkmdllj"
          python3 - <<'PY'
          import os
          import re
          import sys
          from urllib.parse import unquote, urlparse

          ref = os.environ["SUPABASE_PROJECT_REF"]
          url = os.environ["SUPABASE_DB_URL"]

          if re.search(r'@\[[A-Za-z0-9.-]+\](?=:\d|/|$)', url):
              print("ERROR: SUPABASE_DB_URL has brackets around a DNS hostname.", file=sys.stderr)
              sys.exit(1)

          try:
              parsed = urlparse(url)
              host = parsed.hostname or ""
              user = unquote(parsed.username or "")
              port = parsed.port
          except ValueError:
              print("ERROR: SUPABASE_DB_URL is malformed (check hostname brackets and port).", file=sys.stderr)
              sys.exit(1)

          if parsed.scheme not in ("postgres", "postgresql") or not host:
              print("ERROR: SUPABASE_DB_URL must be a valid PostgreSQL URL with a hostname.", file=sys.stderr)
              sys.exit(1)
          if ref not in host and ref not in user:
              print("ERROR: SUPABASE_DB_URL does not identify the approved TestDZ project.", file=sys.stderr)
              sys.exit(1)

          print(f"hostname: {host}")
          print(f"user: {user}")
          print(f"port: {port}")
          print(f"database: {parsed.path.lstrip('/') or 'postgres'}")
          print(f"url length: {len(url)}")
          print(f"project ref: {ref}")
          PY

      - name: Test PostgreSQL connection (read-only)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -c "SELECT 1;"

      - name: Link only to the approved development project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          test "$SUPABASE_PROJECT_REF" = "naqjjykcglxiobkmdllj"
          supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Keep the complete applied history and only the selected pending migration
        env:
          MIGRATION: ${{ inputs.migration }}
        run: |
          set -euo pipefail
          case "$MIGRATION" in
            016a)
              rm -- supabase/migrations/20261107000200_assignments_feedback_constraints.sql
              rm -- supabase/migrations/20261107000300_cohort_triggers_data_migration.sql
              EXPECTED_VERSION="20261107000100"
              ;;
            016b)
              rm -- supabase/migrations/20261107000300_cohort_triggers_data_migration.sql
              EXPECTED_VERSION="20261107000200"
              ;;
            016c)
              EXPECTED_VERSION="20261107000300"
              ;;
            *)
              echo "Unsupported migration selection"
              exit 1
              ;;
          esac
          test -f "supabase/migrations/$EXPECTED_VERSION"_*.sql
          echo "Dry-run target version: $EXPECTED_VERSION"

      - name: Preview selected migration only (dry-run)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          supabase db push --dry-run --remote="$SUPABASE_DB_URL"

  apply:
    needs: verify-preconditions
    if: github.ref == 'refs/heads/feat/week-4-design-system' && inputs.mode == 'apply'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: development
    steps:
      - name: Checkout the approved base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up pinned Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 3.2.0

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Link only to the approved development project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          test "$SUPABASE_PROJECT_REF" = "naqjjykcglxiobkmdllj"
          supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Keep the complete applied history and only the selected pending migration
        env:
          MIGRATION: ${{ inputs.migration }}
        run: |
          set -euo pipefail
          case "$MIGRATION" in
            016a)
              rm -- supabase/migrations/20261107000200_assignments_feedback_constraints.sql
              rm -- supabase/migrations/20261107000300_cohort_triggers_data_migration.sql
              EXPECTED_VERSION="20261107000100"
              ;;
            016b)
              rm -- supabase/migrations/20261107000300_cohort_triggers_data_migration.sql
              EXPECTED_VERSION="20261107000200"
              ;;
            016c)
              EXPECTED_VERSION="20261107000300"
              ;;
            *)
              echo "Unsupported migration selection"
              exit 1
              ;;
          esac
          test -f "supabase/migrations/${EXPECTED_VERSION}_"*.sql
          echo "Selected target version: $EXPECTED_VERSION"
          echo "Earlier migration files are retained; only later pending files are excluded."

      - name: Preview pending changes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          supabase db push --dry-run --remote="$SUPABASE_DB_URL"

      - name: Apply selected migration
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          if ! supabase db push --yes --remote="$SUPABASE_DB_URL"; then
            echo "::error::Migration push failed. No automatic rollback is claimed; inspect supabase_migrations.schema_migrations and the database schema before retrying."
            exit 1
          fi

      - name: Verify exact migration history and database structure
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          MIGRATION: ${{ inputs.migration }}
        run: |
          set -euo pipefail
          case "$MIGRATION" in
            016a) FILE="supabase/tests/verify_016a.sql" ;;
            016b) FILE="supabase/tests/verify_016b.sql" ;;
            016c) FILE="supabase/tests/verify_016c.sql" ;;
            *) echo "Unsupported migration selection"; exit 1 ;;
          esac
          if ! psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -f "$FILE"; then
            echo "::error::Post-apply verification failed. The migration MAY already be recorded/applied; inspect schema_migrations and the live schema. Do not blindly rerun."
            exit 1
          fi
