name: Apply one Supabase migration to TestDZ-Rebuild

on:
  workflow_dispatch:
    inputs:
      migration_version:
        description: Exact 14-digit version of the migration to apply
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: testdz-rebuild-manual-migrations
  cancel-in-progress: false

jobs:
  apply:
    # Deployments are dispatched from protected main only. The GitHub Environment
    # must have required reviewers configured in repository settings.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: testdz-rebuild-migrations
    steps:
      - name: Checkout protected main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}

      - name: Set up pinned Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 3.2.0

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Validate the only permitted remote target
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          test "$SUPABASE_PROJECT_REF" = "ouzppgsvwsgtqyabkwjk"
          test -n "$SUPABASE_DB_URL"
          python3 - <<'PY'
          import os
          from urllib.parse import unquote, urlparse

          expected_ref = "ouzppgsvwsgtqyabkwjk"
          ref = os.environ["SUPABASE_PROJECT_REF"]
          parsed = urlparse(os.environ["SUPABASE_DB_URL"])
          host = parsed.hostname or ""
          user = unquote(parsed.username or "")
          if ref != expected_ref or (ref not in host and f".{ref}" not in user):
              raise SystemExit("Database URL does not identify the approved TestDZ-Rebuild project")
          PY

      - name: Link the validated Rebuild project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          test "$SUPABASE_PROJECT_REF" = "ouzppgsvwsgtqyabkwjk"
          supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Select exactly one pending migration and exclude staging-only files
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          MIGRATION_VERSION: ${{ inputs.migration_version }}
        run: |
          set -euo pipefail
          [[ "$MIGRATION_VERSION" =~ ^[0-9]{14}$ ]]

          selected_file="$(find supabase/migrations -maxdepth 1 -type f -name "${MIGRATION_VERSION}_*.sql" -print -quit)"
          test -n "$selected_file"
          test -f "$selected_file"

          applied_file="$(mktemp)"
          trap 'rm -f "$applied_file"' EXIT
          psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -Atqc \
            "SELECT version FROM supabase_migrations.schema_migrations ORDER BY version" > "$applied_file"

          if grep -Eiq 'staging[-_ ]only' "$selected_file"; then
            echo "::error::The selected migration is marked staging-only and cannot be deployed by this workflow."
            exit 1
          fi
          if grep -Fxq "$MIGRATION_VERSION" "$applied_file"; then
            echo "::error::The selected migration is already recorded as applied."
            exit 1
          fi

          for file in supabase/migrations/*.sql; do
            version="$(basename "$file" | cut -d_ -f1)"
            [[ "$version" =~ ^[0-9]{14}$ ]] || {
              echo "::error::Unexpected migration filename: $file"
              exit 1
            }

            if grep -Fxq "$version" "$applied_file"; then
              continue
            fi

            if [[ "$version" < "$MIGRATION_VERSION" ]]; then
              echo "::error::Earlier migration $version is still pending. Apply migrations in order."
              exit 1
            fi

            if [[ "$version" > "$MIGRATION_VERSION" ]]; then
              # Supabase db push applies every pending file in its directory.
              # Remove later pending files from this ephemeral runner so only
              # the explicitly selected migration can be pushed.
              rm -- "$file"
            fi
          done

          test -f "$selected_file"
          echo "Validated selected migration version: $MIGRATION_VERSION"

      - name: Preview the single selected migration
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          supabase db push --remote --dry-run

      - name: Apply the selected migration
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          if ! supabase db push --remote --yes; then
            echo "::error::Migration push failed. No automatic rollback is claimed; inspect migration history and schema before retrying."
            exit 1
          fi

      - name: Verify the selected migration was recorded
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          MIGRATION_VERSION: ${{ inputs.migration_version }}
        run: |
          set -euo pipefail
          psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -v version="$MIGRATION_VERSION" \
            -c "SELECT 1 FROM supabase_migrations.schema_migrations WHERE version = :'version';" \
            | grep -q '1'
