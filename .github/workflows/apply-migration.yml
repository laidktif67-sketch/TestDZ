name: Remote Supabase migrations (disabled until an approval gate is available)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refuse-remote-migration:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Refuse remote migration deployment
        run: |
          echo "::error::Remote migrations are disabled. Required GitHub Environment reviewers are unavailable for this private repository on the current plan."
          echo "Run database and RLS regression tests against local Supabase only."
          exit 1
